<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" preserveAspectRatio="xMidYMid meet" role="img" aria-label="PROFITPATH Sports">
  <!--
    PROFITPATH wordmark — single source of truth.
    ViewBox sized generously to fit text + subtitle with safety margin.
    Rendered identically at any size (sidebar 180px, hero up to 640px).
    PROFIT = off-white #F0EEE8 / PATH = brand green #4DFF78
    SPORTS subtitle = dim white-32%, generous letter-spacing.
  -->
  <text
    x="500" y="135"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
    font-weight="800"
    font-size="150"
    letter-spacing="-5"
    font-optical-sizing="none"
    text-rendering="geometricPrecision">
    <tspan fill="#F0EEE8">PROFIT</tspan><tspan fill="#4DFF78">PATH</tspan>
  </text>
  <text
    x="500" y="180"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
    font-weight="400"
    font-size="20"
    letter-spacing="11"
    fill="rgba(240,238,232,0.32)"
    text-rendering="geometricPrecision">SPORTS</text>
</svg>
