<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" preserveAspectRatio="xMidYMid meet" role="img" aria-label="PROFITPATH Sports">
  <!--
    PROFITPATH wordmark — single source of truth.
    Bumped SPORTS subtitle to fs=42 (was 20) so it stays legible at
    sidebar scale (~180-220px width) and reads as part of the logo,
    not an afterthought.
  -->
  <text
    x="500" y="135"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
    font-weight="800"
    font-size="150"
    letter-spacing="-5"
    font-optical-sizing="none"
    text-rendering="geometricPrecision">
    <tspan fill="#F0EEE8">PROFIT</tspan><tspan fill="#4DFF78">PATH</tspan>
  </text>
  <text
    x="500" y="195"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
    font-weight="500"
    font-size="42"
    letter-spacing="14"
    fill="rgba(240,238,232,0.42)"
    text-rendering="geometricPrecision">SPORTS</text>
</svg>
