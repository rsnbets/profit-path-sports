name: Build hot-streaks data

on:
  schedule:
    # 09:00 UTC = 5am ET — after every West Coast game is final, before the site's morning traffic
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build streaks.json
        run: python scripts/build_streaks.py
      - name: Commit if changed
        run: |
          git config user.name "streaks-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/streaks.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Daily hot-streaks data refresh"
          git push
