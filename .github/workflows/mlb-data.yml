name: Build MLB + NFL + NBA data

# Every dataset only changes once the day's games are final, so all three sports
# share one daily job — two workflows on the same cron would race each other to
# push to main. MLB: Stats API. NFL: nflverse. NBA: ESPN site API.

on:
  schedule:
    # 09:00 UTC = 5am ET — after every West Coast game is final, before the site's morning traffic
    - cron: '0 9,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build player database (the only API pull)
        run: python scripts/build_playerdb.py
      - name: Derive streaks.json (hot-streaks board)
        run: python scripts/build_streaks.py
      - name: Derive pitchers.json (starting-pitcher board)
        run: python scripts/build_pitchers.py
      - name: Build NFL player database (nflverse pull)
        run: python scripts/build_nfl_playerdb.py
      - name: Derive NFL streaks
        run: python scripts/build_nfl_streaks.py
      - name: Grade tracked NFL props (Prop Shop honesty loop)
        run: python scripts/build_nfl_prop_results.py || echo "prop grading skipped"
      - name: Build NBA player database (ESPN pull)
        run: python scripts/build_nba_playerdb.py
      - name: Derive NBA streaks
        run: python scripts/build_nba_streaks.py
      - name: Commit if changed
        run: |
          git config user.name "mlb-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Daily MLB/NFL/NBA data refresh"
          # a delayed cron can land inside the lineups bot's window
          git pull --rebase origin main
          git push
