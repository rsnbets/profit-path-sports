name: Build MLB data

# Both datasets come from the same free MLB Stats API and only change once the
# day's games are final, so they share one daily job — two workflows on the same
# cron would race each other to push to main.

on:
  schedule:
    # 09:00 UTC = 5am ET — after every West Coast game is final, before the site's morning traffic
    - cron: '0 9,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build player database (the only API pull)
        run: python scripts/build_playerdb.py
      - name: Derive streaks.json (hot-streaks board)
        run: python scripts/build_streaks.py
      - name: Derive pitchers.json (starting-pitcher board)
        run: python scripts/build_pitchers.py
      - name: Commit if changed
        run: |
          git config user.name "mlb-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Daily MLB data refresh"
          # a delayed cron can land inside the lineups bot's window
          git pull --rebase origin main
          git push
