name: Collect card sales

# Sales can only be fetched inside the API's rolling lookback window, so a day
# missed is a day lost for good. Runs daily, well clear of the MLB/NFL job at
# 09:00/12:00 UTC so the two never race to push to main.
#
# Timing is not critical: eBay sales are indexed with roughly a two-day lag, so
# the fetcher syncs on `indexed_after` rather than sale date and a late run
# loses nothing.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: card-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pull new sales into the raw store
        env:
          TCA_API_KEY: ${{ secrets.TCA_API_KEY }}
        run: python scripts/card_prices/fetch_sales.py

      - name: Derive per-card prices for the boards
        run: python scripts/card_prices/derive_prices.py

      - name: Commit if changed
        run: |
          git config user.name "card-prices-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/card-sales data/card-prices
          git diff --cached --quiet && echo "No new sales" && exit 0
          git commit -m "Card sales refresh"
          # a delayed cron can land inside another bot's push window, and a
          # failed push here costs a day of sales that cannot be re-fetched
          git pull --rebase origin main
          git push
